name: Renovate

on:
  schedule:
    # Run monthly (1st day of the month at 1am UTC)
    - cron: '0 1 1 * *'
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]
  issues:
    types: [edited]

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate Bot
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'renovate/') && github.event.pull_request.user.login == 'renovate-updates[bot]') ||
      (github.event_name == 'issues' && github.event.issue.user.login == 'renovate-updates[bot]' && github.event.issue.title == 'Dependency Dashboard' && !endsWith(github.actor, '[bot]'))
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213  # v46.3.9
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: 'false'
          LOG_LEVEL: debug
