name: Renovate

on:
  schedule:
    # Run monthly (1st day of the month at 1am UTC)
    - cron: '0 1 1 * *'
  workflow_dispatch:

jobs:
  renovate:
    name: Renovate Bot
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app-token
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@6d859fc95779be83a0335ca704879b47e5d79641
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: full
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_ALLOWED_POST_UPGRADE_COMMANDS: '["^cd ts && npm ci && npm run lint -- --fix$"]'
          LOG_LEVEL: info

