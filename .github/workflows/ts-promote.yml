name: TypeScript SDK Release Promotion

on:
  release:
    types: [released]

permissions:
  contents: read
  id-token: write

jobs:
  get-version:
    name: Get Version from Tag
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - id: get-version
        name: Get Version
        run: |
          # Get the full tag name (e.g. v0.4.0)
          TAG=${GITHUB_REF#refs/tags/}

          # Strip the leading 'v' (e.g. 0.4.0)
          VERSION=${TAG#v}

          printf "version=%s\n" "$VERSION" >> "$GITHUB_OUTPUT"

  deploy-release:
    name: Deploy Release to npm
    needs: [get-version]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc')
    runs-on: ubuntu-latest
    environment:
      name: npm-production
      url: https://www.npmjs.com/package/@aembit/edge-sdk/v/${{ needs.get-version.outputs.version }}
    defaults:
      run:
        working-directory: ts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: ts/package-lock.json
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches release tag
        run: |
          TAG_VERSION="${{ needs.get-version.outputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Release Tag Version: $TAG_VERSION"
          echo "package.json Version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)!"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with Coverage
        run: npm run test:coverage

      - name: Build and verify package artifact
        run: |
          npm run build
          npm pack
          tar -ztvf aembit-edge-sdk-*.tgz | grep -F "package/LICENSE"
          tar -ztvf aembit-edge-sdk-*.tgz | grep -F "package/README.md"
          tar -ztvf aembit-edge-sdk-*.tgz | grep -F "package/dist/index.d.ts"

      - name: Publish Release to npm
        run: npm publish --tag latest --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Fetch Slack Token
        if: always()
        id: slack-token
        uses: Aembit/get-credentials@0b519d6b50789a1a7f6f82d5c18badd17c62415b # v1.2.0
        with:
          client-id: aembit:devbroadangle:3c49ef:identity:github_idtoken:b65f00e6-9fad-4298-bd46-a70d017eeb2a
          domain: 'devbroadangle.aembit-eng.com'
          credential-type: 'ApiKey'
          server-host: 'slack.com'
        continue-on-error: true

      - name: 📋 Build Slack Notification
        if: always()
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          STATUS="${{ job.status }}"
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"

          if [[ "$STATUS" == "success" ]]; then
            ICON="white_check_mark"
          else
            ICON="x"
          fi

          jq -n \
            --arg channel "C0A9RML07MF" \
            --arg repo "$REPO" \
            --arg run_id "$RUN_ID" \
            --arg version "$VERSION" \
            --arg icon "$ICON" \
            '{
              "channel": $channel,
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": (":" + $icon + ": *TypeScript SDK Release Deployment*")
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": ("*Package:*\n@aembit/edge-sdk@latest\n*Version:*\n" + $version)
                    },
                    {
                      "type": "mrkdwn",
                      "text": ("*Details:*\n<https://github.com/" + $repo + "/actions/runs/" + $run_id + "|View GitHub Job>")
                    }
                  ]
                }
              ]
            }' > slack_payload.json

      - name: Send Notification
        if: always() && steps.slack-token.outputs.api-key != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ steps.slack-token.outputs.api-key }}
          payload-file-path: ts/slack_payload.json
        continue-on-error: true
