[build-system]
requires = [
    "hatchling>=1.27.0",
]
build-backend = "hatchling.build"

[project]
name = "aembit-edge-sdk"
version = "0.1.0"
description = "Python SDK for the Aembit Edge API"
readme = "README.md"
requires-python = ">=3.10"
license-files = [
    "LICENSE",
]
authors = [
    { name = "Aembit" },
]
keywords = [
    "aembit",
    "credentials",
    "edge",
    "sdk",
    "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "botocore>=1.42.83",
]

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
dev = [
    "mutmut>=3.7.0",
    "pip-audit>=2.8.0",
    "pyright>=1.1.408",
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/aembit_edge",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/aembit_edge",
    "tests",
    "examples",
    "README.md",
    "AGENTS.md",
    "architecture.md",
    "pyproject.toml",
    "LICENSE",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
    "tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "PT",
    "UP",
]

[tool.mutmut]
source_paths = [
    "src/aembit_edge/",
]
runner = "pytest"
only_mutate = [
    "src/aembit_edge/internal/client/auth_parsing.py",
]
pytest_add_cli_args = [
    "-o",
    "pythonpath=src",
]
