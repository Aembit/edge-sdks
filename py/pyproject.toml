[build-system]
requires = [
    "hatchling>=1.27.0",
]
build-backend = "hatchling.build"

[project]
name = "aembit-edge-sdk"
version = "1.34.1"
description = "Official Python SDK for the Aembit Edge API: workload identity authentication and secretless credential retrieval"
readme = "README.md"
requires-python = ">=3.12"
license-files = [
    "LICENSE",
]
authors = [
    { name = "Aembit, Inc.", email = "support@aembit.io" },
]
keywords = [
    "aembit",
    "ai-agents",
    "authentication",
    "aws-imds",
    "aws-sts",
    "azure-imds",
    "credentials",
    "gcp",
    "github-actions",
    "gitlab-ci",
    "iam",
    "kubernetes",
    "mcp",
    "model-context-protocol",
    "non-human-identity",
    "oauth2",
    "oidc",
    "secretless",
    "secrets-management",
    "security",
    "terraform-cloud",
    "token-management",
    "workload-identity",
    "zero-trust",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
dependencies = [
    "botocore>=1.42.83",
]

[project.license]
text = "Apache-2.0"

[project.urls]
Homepage = "https://docs.aembit.io/dev-guide/api/edge/"
Documentation = "https://docs.aembit.io/dev-guide/api/edge/"
Repository = "https://github.com/Aembit/edge-sdks"
Issues = "https://github.com/Aembit/edge-sdks/issues"
Changelog = "https://github.com/Aembit/edge-sdks/releases"

[project.optional-dependencies]
dev = [
    "mutmut>=3.7.0",
    "pip-audit>=2.8.0",
    "pyright>=1.1.408",
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/aembit_edge",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/aembit_edge",
    "tests",
    "examples",
    "README.md",
    "AGENTS.md",
    "architecture.md",
    "pyproject.toml",
    "LICENSE",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
    "tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "PT",
    "UP",
]
ignore = [
    "UP040", # Type alias using TypeAlias (cleaner pyright compatibility across Python 3.12 versions)
    "UP046", # Generic class subclassing Generic[T]
    "UP047", # Generic function using TypeVar
]

[tool.mutmut]
source_paths = [
    "src/aembit_edge/",
]
runner = "pytest"
only_mutate = [
    "src/aembit_edge/internal/client/auth_parsing.py",
]
pytest_add_cli_args = [
    "-o",
    "pythonpath=src",
]
